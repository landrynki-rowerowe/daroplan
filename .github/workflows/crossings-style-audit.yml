name: Audyt kolorow pinezek - gladkie przejazdy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-crossing-styles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz KML i sprawdz style oryginalnych pinezek
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import io
          import json
          import re
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          MID = "1WhaTsv1tTIX968oqzBFcrABayYjnE5I"
          FOLDERS = ("Przejazdy poprawione przez ZDMK", "Propozycje strony społecznej")
          NS = {"k": "http://www.opengis.net/kml/2.2"}
          URL = f"https://www.google.com/maps/d/kml?mid={MID}&forcekml=1"
          req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0 (DaRoPlan styles audit)"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              raw = resp.read()
          if len(raw) < 1000:
              raise SystemExit("KML jest podejrzanie maly")
          if raw[:2] == b"PK":
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names = [n for n in z.namelist() if n.lower().endswith(".kml")]
                  if not names:
                      raise SystemExit("KMZ bez KML")
                  raw = z.read(names[0])
          root = ET.fromstring(raw)

          def normal_ref(value):
              return (value or "").strip().rsplit("#", 1)[-1]

          styles = {}
          for s in root.findall(".//k:Style", NS):
              sid = s.get("id")
              if sid:
                  styles[sid] = s
          stylemaps = {}
          for sm in root.findall(".//k:StyleMap", NS):
              sid = sm.get("id")
              if not sid:
                  continue
              pairs = sm.findall("k:Pair", NS)
              ref = next((p.findtext("k:styleUrl", "", NS) for p in pairs if p.findtext("k:key", "", NS) == "normal"), None)
              if ref is None and pairs:
                  ref = pairs[0].findtext("k:styleUrl", "", NS)
              stylemaps[sid] = normal_ref(ref)

          def resolve(raw_ref):
              ref = normal_ref(raw_ref)
              seen = set()
              while ref in stylemaps and ref not in seen:
                  seen.add(ref)
                  ref = stylemaps[ref]
              return ref

          def extract_style(pm):
              raw_ref = (pm.findtext("k:styleUrl", "", NS) or "").strip()
              style_ref = resolve(raw_ref)
              match = re.search(r"(?i)(?:^|#)?icon-\d+-([0-9a-f]{6})(?:-|$)", style_ref)
              style_hex = match.group(1).upper() if match else None
              inline = pm.find("k:Style", NS)
              shared = styles.get(style_ref)
              style = inline if inline is not None else shared
              icon = style.find("k:IconStyle", NS) if style is not None else None
              color = icon.findtext("k:color", "", NS).strip() if icon is not None else ""
              href = icon.findtext("k:Icon/k:href", "", NS).strip() if icon is not None else ""
              # W KML kolor ma uklad AABBGGRR, a w styleUrl My Maps zwykle RRGGBB.
              kml_hex = "#" + color[6:8] + color[4:6] + color[2:4] if re.fullmatch(r"[0-9a-fA-F]{8}", color) else None
              return {"style_url": raw_ref, "resolved_style": style_ref,
                      "color_from_style_id": ("#" + style_hex) if style_hex else None,
                      "kml_icon_color": kml_hex, "icon_href": href}

          report = {"source_mid": MID, "folders": {}, "notice": "Audyt tylko odczytuje KML; nie publikuje GeoJSON."}
          for name in FOLDERS:
              folder = next((f for f in root.findall(".//k:Folder", NS)
                             if f.findtext("k:name", "", NS).strip() == name), None)
              if folder is None:
                  raise SystemExit(f"Brakuje folderu: {name}")
              styles_by_key = collections.defaultdict(lambda: {"count": 0, "examples": [], "style": None})
              placemarks = folder.findall("./k:Placemark", NS)
              for pm in placemarks:
                  st = extract_style(pm)
                  key = json.dumps(st, sort_keys=True, ensure_ascii=False)
                  row = styles_by_key[key]
                  row["count"] += 1
                  row["style"] = st
                  if len(row["examples"]) < 3:
                      row["examples"].append(pm.findtext("k:name", "", NS).strip())
              rows = sorted(styles_by_key.values(), key=lambda x: -x["count"])
              report["folders"][name] = {"total": len(placemarks), "styles": rows}
              print(f"=== {name}: {len(placemarks)} obiektow; {len(rows)} styli ===")
              for row in rows:
                  s = row["style"]
                  print(f'  {row["count"]:>4}  style={s["resolved_style"]!r}  color_id={s["color_from_style_id"]}  kml_color={s["kml_icon_color"]}  przyklady={row["examples"]}')
          Path("crossings-styles-audit.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Dolacz raport audytu
        uses: actions/upload-artifact@v4
        with:
          name: crossings-styles-audit
          path: crossings-styles-audit.json
          if-no-files-found: error
          retention-days: 14
