name: TEST — przejazdy ZDMK i propozycje społeczne

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-crossings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pobierz i przetwórz dane z Google My Maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wynik

          cat > /tmp/update_crossings.py <<'PY'
          import io
          import json
          import re
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET
          from html import unescape
          from pathlib import Path

          MID = "1WhaTsv1tTIX968oqzBFcrABayYjnE5I"
          URL = f"https://www.google.com/maps/d/kml?mid={MID}&forcekml=1"

          NS = {"k": "http://www.opengis.net/kml/2.2"}

          FOLDERS = {
              "Przejazdy poprawione przez ZDMK": "wynik/przejazdy-zdmk.geojson",
              "Propozycje strony społecznej": "wynik/propozycje-spoleczne.geojson",
          }

          def clean_description(raw):
              text = unescape(raw or "")

              text = re.sub(r"(?i)<br\\s*/?>", "\\n", text)
              text = re.sub(r"(?i)</?(p|div|li|tr|h[1-6])[^>]*>", "\\n", text)

              text = re.sub(r"(?is)<img\\b[^>]*>", "", text)
              text = re.sub(r"(?is)<script\\b.*?</script>", "", text)
              text = re.sub(r"(?is)<style\\b.*?</style>", "", text)

              text = re.sub(r"(?s)<[^>]+>", "", text)
              text = text.replace("\\xa0", " ")

              lines = [" ".join(line.split()) for line in text.splitlines()]
              cleaned = []
              previous_blank = False

              for line in lines:
                  if line:
                      cleaned.append(line)
                      previous_blank = False
                  elif cleaned and not previous_blank:
                      cleaned.append("")
                      previous_blank = True

              while cleaned and cleaned[-1] == "":
                  cleaned.pop()

              return "\\n".join(cleaned).strip()

          def parse_point_coords(text):
              tokens = (text or "").split()
              if not tokens:
                  return None

              parts = tokens[0].split(",")
              if len(parts) < 2:
                  return None

              lon = float(parts[0])
              lat = float(parts[1])

              if not (-180 <= lon <= 180 and -90 <= lat <= 90):
                  raise ValueError(f"Niepoprawne współrzędne: {lon}, {lat}")

              return [lon, lat]

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0 (GitHub Actions DaRoPlan test)"}
          )

          with urllib.request.urlopen(req, timeout=60) as response:
              raw = response.read()

          if len(raw) < 1000:
              raise SystemExit("Pobrany plik z Google jest podejrzanie mały")

          print("Pobrano z Google:", len(raw), "bajtów")

          if raw[:2] == b"PK":
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names = [n for n in z.namelist() if n.lower().endswith(".kml")]
                  if not names:
                      raise SystemExit("KMZ nie zawiera pliku KML")
                  raw = z.read(names[0])

          root = ET.fromstring(raw)

          report = []

          for folder_name, target_path in FOLDERS.items():
              folder = None

              for f in root.findall(".//k:Folder", NS):
                  if f.findtext("k:name", "", NS).strip() == folder_name:
                      folder = f
                      break

              if folder is None:
                  raise SystemExit(f'Nie znaleziono folderu "{folder_name}"')

              features = []

              for pm in folder.findall("./k:Placemark", NS):
                  name = pm.findtext("k:name", "", NS).strip()
                  description = clean_description(
                      pm.findtext("k:description", "", NS)
                  )

                  point = pm.find(".//k:Point/k:coordinates", NS)
                  if point is None:
                      print("UWAGA: pominięto obiekt bez Point:", name)
                      continue

                  coords = parse_point_coords(point.text)
                  if coords is None:
                      print("UWAGA: pominięto punkt bez współrzędnych:", name)
                      continue

                  features.append({
                      "type": "Feature",
                      "properties": {
                          "name": name,
                          "description": description,
                          "source_folder": folder_name,
                          "source": "Google My Maps"
                      },
                      "geometry": {
                          "type": "Point",
                          "coordinates": coords
                      }
                  })

              if not features:
                  raise SystemExit(f'Folder "{folder_name}" nie zawiera punktów')

              data = {
                  "type": "FeatureCollection",
                  "features": features
              }

              Path(target_path).write_text(
                  json.dumps(data, ensure_ascii=False, separators=(",", ":")) + "\n",
                  encoding="utf-8"
              )

              report.append(
                  f'{folder_name}: {len(features)} punktów'
              )

          Path("wynik/RAPORT.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("\\n".join(report))
          PY

          python3 /tmp/update_crossings.py

      - name: Zweryfikuj GeoJSON
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          FILES = {
              "wynik/przejazdy-zdmk.geojson": 50,
              "wynik/propozycje-spoleczne.geojson": 20,
          }

          def fail(msg):
              raise SystemExit("BŁĄD WALIDACJI: " + msg)

          for path, min_count in FILES.items():
              data = json.loads(Path(path).read_text(encoding="utf-8"))

              if data.get("type") != "FeatureCollection":
                  fail(f"{path}: root.type != FeatureCollection")

              features = data.get("features")
              if not isinstance(features, list) or len(features) < min_count:
                  fail(
                      f"{path}: podejrzanie mało obiektów: "
                      f"{0 if not isinstance(features, list) else len(features)}"
                  )

              for i, feature in enumerate(features):
                  if feature.get("type") != "Feature":
                      fail(f"{path}, feature #{i}: to nie Feature")

                  geom = feature.get("geometry") or {}
                  props = feature.get("properties") or {}

                  if geom.get("type") != "Point":
                      fail(
                          f"{path}, feature #{i}: "
                          f"oczekiwano Point, jest {geom.get('type')!r}"
                      )

                  coords = geom.get("coordinates")
                  if (
                      not isinstance(coords, list)
                      or len(coords) < 2
                      or not all(isinstance(x, (int, float)) for x in coords[:2])
                  ):
                      fail(f"{path}, feature #{i}: błędne współrzędne")

                  lon, lat = coords[:2]

                  if not (
                      math.isfinite(lon)
                      and math.isfinite(lat)
                      and -180 <= lon <= 180
                      and -90 <= lat <= 90
                  ):
                      fail(f"{path}, feature #{i}: współrzędne poza zakresem")

                  description = props.get("description") or ""
                  if "<" in description and ">" in description:
                      fail(
                          f"{path}, feature #{i}: "
                          "opis nadal zawiera tagi HTML"
                      )

              print(f"OK: {path} | {len(features)} punktów")
          PY

      - name: Udostępnij wynik testu
        uses: actions/upload-artifact@v7
        with:
          name: crossings-test-${{ github.run_number }}
          path: |
            wynik/przejazdy-zdmk.geojson
            wynik/propozycje-spoleczne.geojson
            wynik/RAPORT.txt
          if-no-files-found: error
          retention-days: 7
