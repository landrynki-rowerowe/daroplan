
name: Publikuj DaRoPlan DEV

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daroplan-dev-deploy
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z galezi dev
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Sprawdz pliki aplikacji
        run: |
          set -euo pipefail
          test -s index.html
          test -s js/app.js
          test -d css
          test -d data
          echo "PLIKI OK"

      - name: Zainstaluj sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Przygotuj bezpieczne polaczenie SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          EXPECTED: ${{ secrets.SSH_FINGERPRINT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -T 15 -p "$PORT" \
            -t ed25519 "$HOST" \
            > ~/.ssh/known_hosts 2>/dev/null

          test -s ~/.ssh/known_hosts

          ACTUAL=$(ssh-keygen -lf \
            ~/.ssh/known_hosts -E sha256 \
            | awk '{print $2}')

          test "$ACTUAL" = "$EXPECTED" || {
            echo "FINGERPRINT MISMATCH"
            exit 1
          }

          chmod 600 ~/.ssh/known_hosts
          echo "FINGERPRINT OK"

      - name: Sprawdz katalog docelowy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$PORT" \
            "$USER@$HOST" \
            'test -d rowerowy.otwartyplan.org/public_html/mapa-dev && test ! -L rowerowy.otwartyplan.org/public_html/mapa-dev'

          echo "KATALOG DEV OK"

      - name: Publikuj pliki DEV
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e scp \
            -o StrictHostKeyChecking=yes \
            -P "$PORT" \
            -r \
            index.html css js data \
            "$USER@$HOST:rowerowy.otwartyplan.org/public_html/mapa-dev/"

          echo "PLIKI PRZESLANE"

      - name: Sprawdz publikacje
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            'cd rowerowy.otwartyplan.org/public_html/mapa-dev && test -s index.html && test -s js/app.js && echo "DAROPLAN DEV DEPLOY OK"'
