
name: Test SSH - dhosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdz katalog DaRoPlanu
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          command_timeout: 30s
          
          script: |
            echo "Katalog public_html:"
            ls -la rowerowy.otwartyplan.org/public_html

            echo "Katalog aplikacji mapa:"
            ls -la rowerowy.otwartyplan.org/public_html/mapa

            echo "Sprawdzenie index.html:"
            if [ -f rowerowy.otwartyplan.org/public_html/mapa/index.html ]; then
              echo "OK - znaleziono DaRoPlan index.html"
            else
              echo "Nie znaleziono index.html w tej lokalizacji"
            fi

