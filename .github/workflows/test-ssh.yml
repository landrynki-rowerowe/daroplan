
name: Test SSH - dhosting

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdz katalog DaRoPlanu
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 30s
          command_timeout: 30s
          script: |
            echo "Katalog domeny:"
            ls -la rowerowy.otwartyplan.org

            echo "Katalog mapy:"
            ls -la rowerowy.otwartyplan.org/mapa

            echo "Pliki HTML:"
            ls -l rowerowy.otwartyplan.org/mapa/index.html

