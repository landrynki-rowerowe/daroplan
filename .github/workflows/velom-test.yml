name: TEST VeloMałopolska — bez publikacji

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-velom:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz kod z gałęzi dev
        uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false

      - name: Ustaw Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zachowaj kopię danych aktualnie działających na mapa-dev
        run: |
          set -euo pipefail
          mkdir -p baseline wynik

          curl --fail --silent --show-error --location \
            "https://rowerowy.otwartyplan.org/mapa-dev/data/velomalopolska.geojson" \
            -o baseline/velomalopolska.geojson

          curl --fail --silent --show-error --location \
            "https://rowerowy.otwartyplan.org/mapa-dev/data/velo-objazdy.geojson" \
            -o baseline/velo-objazdy.geojson

      - name: Wygeneruj aktualną główną warstwę VeloM
        run: |
          set -euo pipefail
          test -f scripts/update_velo.py
          python3 scripts/update_velo.py
          cp data/velomalopolska.geojson wynik/velomalopolska.geojson

      - name: Wygeneruj aktualne objazdy i utrudnienia z Google My Maps
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/update_objazdy.py <<'PY'
          import io
          import json
          import urllib.request
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          MID = "16UMazp6pz-IQxUXpUl1c3suxCMHPcpFE"
          URL = f"https://www.google.com/maps/d/kml?mid={MID}&forcekml=1"
          NS = {"k": "http://www.opengis.net/kml/2.2"}
          FOLDER = "Objazdy / utrudnienia"

          def coords(text):
              out = []
              for token in (text or "").split():
                  p = token.split(",")
                  if len(p) >= 2:
                      out.append([float(p[0]), float(p[1])])
              return out

          req = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0 (GitHub Actions VeloM test)"}
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              raw = response.read()

          print("Pobrano z Google:", len(raw), "bajtów")

          if raw[:2] == b"PK":
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  names = [n for n in z.namelist() if n.lower().endswith(".kml")]
                  if not names:
                      raise SystemExit("KMZ nie zawiera KML")
                  raw = z.read(names[0])

          root = ET.fromstring(raw)

          folder = None
          for f in root.findall(".//k:Folder", NS):
              if f.findtext("k:name", "", NS) == FOLDER:
                  folder = f
                  break
          if folder is None:
              raise SystemExit(f'Nie znaleziono folderu "{FOLDER}"')

          features = []
          line_count = 0
          point_count = 0

          for pm in folder.findall("./k:Placemark", NS):
              name = pm.findtext("k:name", "", NS)
              desc = pm.findtext("k:description", "", NS)

              for node in pm.findall(".//k:LineString/k:coordinates", NS):
                  c = coords(node.text)
                  if len(c) < 2:
                      continue
                  features.append({
                      "type": "Feature",
                      "properties": {
                          "name": name,
                          "description": desc,
                          "kind": "line",
                          "source": "VeloMałopolska / Google My Maps"
                      },
                      "geometry": {
                          "type": "LineString",
                          "coordinates": c
                      }
                  })
                  line_count += 1

              for node in pm.findall(".//k:Point/k:coordinates", NS):
                  c = coords(node.text)
                  if not c:
                      continue
                  features.append({
                      "type": "Feature",
                      "properties": {
                          "name": name,
                          "description": desc,
                          "kind": "point",
                          "source": "VeloMałopolska / Google My Maps"
                      },
                      "geometry": {
                          "type": "Point",
                          "coordinates": c[0]
                      }
                  })
                  point_count += 1

          if not features:
              raise SystemExit("Brak obiektów objazdów/utrudnień")

          out = {
              "type": "FeatureCollection",
              "features": features
          }

          Path("wynik/velo-objazdy.geojson").write_text(
              json.dumps(out, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8"
          )

          print(
              "OBJAZDY:",
              len(features),
              "obiektów | linie:",
              line_count,
              "| punkty:",
              point_count
          )
          PY

          python3 /tmp/update_objazdy.py

      - name: Sprawdź i porównaj dane
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              with open(path, encoding="utf-8") as f:
                  d = json.load(f)
              if d.get("type") != "FeatureCollection":
                  raise SystemExit(f"{path}: to nie jest FeatureCollection")
              if not isinstance(d.get("features"), list) or not d["features"]:
                  raise SystemExit(f"{path}: brak features")
              return d

          def summary(path):
              d = load(path)
              geoms = Counter()
              cats = Counter()
              names = []

              for f in d["features"]:
                  g = (f.get("geometry") or {}).get("type")
                  geoms[g] += 1
                  p = f.get("properties") or {}

                  cat = p.get("category")
                  if cat:
                      cats[cat] += 1

                  name = p.get("name")
                  if name:
                      names.append(name)

              return {
                  "features": len(d["features"]),
                  "geometries": dict(geoms),
                  "categories": dict(cats),
                  "names": names
              }

          pairs = [
              (
                  "VeloM główna",
                  "baseline/velomalopolska.geojson",
                  "wynik/velomalopolska.geojson"
              ),
              (
                  "Objazdy / utrudnienia",
                  "baseline/velo-objazdy.geojson",
                  "wynik/velo-objazdy.geojson"
              ),
          ]

          report = []

          for label, old, new in pairs:
              a = summary(old)
              b = summary(new)

              report.append("=" * 72)
              report.append(label)
              report.append(f"OBECNIE NA MAPA-DEV: {a['features']} obiektów")
              report.append(f"NOWE ZE ŹRÓDŁA:       {b['features']} obiektów")
              report.append(f"Geometrie stare: {a['geometries']}")
              report.append(f"Geometrie nowe:  {b['geometries']}")

              if a["categories"] or b["categories"]:
                  report.append(f"Kategorie stare: {a['categories']}")
                  report.append(f"Kategorie nowe:  {b['categories']}")

              old_names = Counter(a["names"])
              new_names = Counter(b["names"])

              added = list((new_names - old_names).elements())
              removed = list((old_names - new_names).elements())

              report.append(f"Nowe nazwy/obiekty wg nazwy: {len(added)}")
              for x in added[:50]:
                  report.append(f"  + {x}")

              report.append(f"Zniknięte nazwy/obiekty wg nazwy: {len(removed)}")
              for x in removed[:50]:
                  report.append(f"  - {x}")

          text = "\n".join(report) + "\n"
          print(text)
          Path("wynik/POROWNANIE.txt").write_text(text, encoding="utf-8")
          PY

      - name: Sprawdź, że test niczego nie publikuje
        run: |
          echo "TEST OK — brak kroków SSH/SCP/FTP i brak zapisu na dhosting."

      - name: Udostępnij wyniki testu
        uses: actions/upload-artifact@v4
        with:
          name: velom-test-${{ github.run_number }}
          path: |
            wynik/velomalopolska.geojson
            wynik/velo-objazdy.geojson
            wynik/POROWNANIE.txt
          if-no-files-found: error
          retention-days: 7
