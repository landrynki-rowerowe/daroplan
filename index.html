<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>DaRoPlan 2.0 · Mapa rowerowa Krakowa</title><meta name="description" content="DaRoPlan — mapa infrastruktury, tras i danych rowerowych Krakowa."><link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet"><link rel="stylesheet" href="css/app.css?v=0.5.2"><script defer src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script><script defer src="js/config.js"></script><script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script><script defer src="js/app.js?v=0.5.2"></script></head><body>
<div id="map" aria-label="Mapa Krakowa"></div>
<header class="topbar"><button id="brand" class="brand" aria-label="O Fundacji Otwarty Plan" title="O projekcie"><img src="https://otwartyplan.org/wp-content/uploads/2021/03/cropped-logo-FOP-czarne_520.jpg" alt="Otwarty Plan" onerror="this.style.display='none';this.parentElement.textContent='OP'"></button><form id="searchForm" class="search" autocomplete="off"><label class="sr-only" for="searchInput">Szukaj miejsc</label><input id="searchInput" placeholder="Szukaj miejsca lub adresu…" maxlength="200"><button type="submit" aria-label="Szukaj">⌕</button><div id="searchResults" class="search-results hidden" role="listbox"></div></form></header>
<div class="top-right"><button id="layersBtn" class="basemap-trigger" aria-label="Otwórz podkłady i warstwy w panelu" aria-expanded="false"><span class="sat-icon"></span><span>Warstwy</span></button></div>
<aside id="infoPanel" class="info-panel hidden" aria-label="Panel DaRoPlanu"><button id="panelExpand" class="panel-expand" aria-label="Rozwiń panel" aria-expanded="false" type="button">⌃</button><button id="infoClose" class="info-close" type="button" aria-label="Zamknij panel">×</button>
<section id="layersMenu" class="panel-section hidden" aria-label="Podkłady i warstwy"><div class="section-head"><h2>Mapa i warstwy</h2></div><h3>Podkład mapowy</h3><div class="base-picker"><button data-base="light">◻<small>Light</small></button><button data-base="original" class="active">▤<small>Obecny</small></button><button data-base="satellite">▧<small>Satelita</small></button></div><h3>Warstwy danych</h3><div id="layerControls"></div><p class="note">Warstwy działają niezależnie od podkładu.</p></section>
<div id="infoContent" class="panel-section"></div></aside>
<div id="mapTools" class="map-tools"><button id="locate" title="Pokaż moją lokalizację" aria-label="Pokaż lub ukryj moją lokalizację" aria-pressed="false">◎</button><button id="share" title="Kopiuj link do widoku" aria-label="Kopiuj link do widoku">↗</button></div>
<nav class="bottom-nav" aria-label="Moduły DaRoPlanu"><button data-mode="infra" class="active"><span>▱</span><small>Infrastruktura</small></button><button data-mode="ruch"><span>▥</span><small>Ruch</small></button><button data-mode="historia"><span>◷</span><small>Historia</small></button><button data-mode="trasy"><span>⌁</span><small>Trasy</small></button><button data-mode="wiecej"><span>•••</span><small>Więcej</small></button></nav>
<div id="toast" class="toast hidden" role="status"></div><div id="status" class="sr-only" role="status"></div>
</body></html>
